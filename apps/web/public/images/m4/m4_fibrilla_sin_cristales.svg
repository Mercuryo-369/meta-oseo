<!-- m4_fibrilla_sin_cristales: m4_fibrilla_mineralizada sin los grupos cristales_intrafibrilares ni cristales_extrafibrilares (los pone el estudiante). -->
<title>Fibrilla de colágeno sin cristales</title>
<desc>La fibrilla de colágeno de la sección 4.1, con cinco filas de moléculas escalonadas y sus zonas de separación (gap zones) vacías, entre dos fibrillas vecinas, y un nódulo mineral de origen vesicular a la izquierda. Abajo, el eje c de un cristal. Es el fondo de la actividad «¿Dentro o fuera de la fibrilla?»: el estudiante coloca los cristales. Esquema no a escala.</desc>
