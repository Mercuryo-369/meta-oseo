<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200">
<!-- m1_hueso_largo_zonas: zonas tocables sobre la figura de la docente «Anatomía de un hueso largo» (OpenStax College,
     2018; m1_2_imagen_03.webp, 800 x 1200), que va debajo como `fondo` de la actividad. Capas (partes que la docente
     definió en 1.2): diafisis, metafisis, epifisis, cavidad_medular, linea_epifisaria, cartilago_articular. Las formas
     son transparentes: solo delimitan cada región; la capa activa se resalta con el contorno que pone la actividad. -->
<title>Anatomía de un hueso largo</title>
<desc>Fémur en corte longitudinal con sus regiones: epífisis proximal y distal, metáfisis, diáfisis, cavidad medular, línea epifisaria y cartílago articular.</desc>
<g id="epifisis">
