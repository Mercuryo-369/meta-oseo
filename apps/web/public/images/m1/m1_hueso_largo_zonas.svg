<path d="M252,1000 L230,1062 L224,1122 L262,1172 L332,1186 L410,1172 L446,1122 L440,1060 L426,1000 Z" fill="transparent"/>
</g>
<g id="metafisis">
<path d="M282,152 L512,152 L422,228 L298,228 Z" fill="transparent"/>
<path d="M300,884 L396,884 L426,1000 L252,1000 Z" fill="transparent"/>
</g>
<g id="diafisis">
<path d="M298,228 L422,228 L400,420 L394,640 L396,884 L300,884 L284,700 L288,460 Z" fill="transparent"/>
</g>
<g id="cavidad_medular">
<path d="M328,242 L366,242 L364,600 L356,858 L336,858 L324,600 Z" fill="transparent"/>
</g>
<g id="linea_epifisaria">
<path d="M284,138 L424,138 L424,164 L284,164 Z" fill="transparent"/>
</g>
<g id="cartilago_articular">
<ellipse cx="462" cy="68" rx="66" ry="52" fill="transparent"/>
<ellipse cx="332" cy="1128" rx="92" ry="48" fill="transparent"/>
</g>
</svg>
