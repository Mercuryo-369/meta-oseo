<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" stroke-linejoin="round" stroke-linecap="round" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<!-- m6_prevencion_mapa. Esquema conceptual, no anatómico (se muestra como imagen). Arriba, las cinco medidas de prevención (verde), cada una con una flecha al mecanismo que aprovecha; en el centro, el hueso como blanco; abajo y aparte, los dos grupos de fármacos (ámbar), con etiquetas neutras y sin dosis. -->
<title>Mapa de prevención y de fármacos</title>
<desc>Esquema conceptual. En el centro está el hueso como blanco. Arriba, cinco medidas de prevención y el mecanismo sobre el que actúa cada una: la carga mecánica, sobre el osteocito y la esclerostina; el calcio, sobre el mineral de la matriz; la vitamina D, sobre la absorción de calcio; los hábitos saludables, sobre la formación ósea; y la prevención de caídas, que reduce los impactos sobre el hueso. Abajo y aparte, dos grupos de fármacos: los antirreabsortivos, que actúan sobre el osteoclasto y RANKL, y los anabólicos, que actúan sobre la vía Wnt y el osteoblasto.</desc>
<g id="fondo_lamina">
<rect x="4" y="4" width="792" height="592" rx="14" fill="#f1edfa" stroke="#2b2350" stroke-width="4"/>
<text x="16" y="34" font-size="30" font-weight="600" fill="#2b2350" stroke="none">Prevención</text>
</g>
<g id="hueso_diana">
<g stroke="#2b2350" stroke-width="12">
