<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" stroke-linejoin="round" stroke-linecap="round" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<!-- m6_atm_cambios_degenerativos. Figura (se muestra como imagen): corte sagital de la ATM con la boca cerrada, anterior a la izquierda. Panel superior normal, panel inferior con cambios degenerativos. Las superficies articulares llevan fibrocartílago (línea fina), no cartílago hialino. Esquema sin escala. Cada panel usa coordenadas locales (0 a 776 por 0 a 276) desplazadas con translate. -->
<title>Articulación temporomandibular: normal y degenerativa</title>
<desc>Corte sagital esquemático de la articulación temporomandibular con la boca cerrada, con la parte anterior a la izquierda. Panel superior, normal: fosa mandibular y eminencia articular del hueso temporal, cóndilo mandibular convexo con una lámina fina de hueso subcondral, fibrocartílago fino sobre las superficies articulares y disco articular bicóncavo, más grueso en sus bandas anterior y posterior. Panel inferior, con cambios degenerativos: cóndilo aplanado, osteofito en el borde anterior, esclerosis subcondral y disco adelgazado y desplazado hacia delante.</desc>
