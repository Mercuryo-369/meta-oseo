# Encargos de ilustración realista (tools/imagenes/README.md). Uno por SVG de multicapa.
#   nombre: el SVG de apps/web/public/images/{modulo}/{nombre}.svg (y el WebP que se genera a su lado)
#   glifos: capas que NO pinta la IA y quedan dibujadas encima (moléculas, receptores, flechas)
#   colores: (opcional) rellenos de formas sueltas que también quedan dibujadas (p. ej. una flecha dentro del fondo)
#   boceto_con_glifos: (opcional) los glifos también guían a la IA (p. ej. trayectorias trabeculares que deben
#     coincidir con el hueso esponjoso pintado debajo)
#   Los rótulos (textos, sus líneas guía y su fondo) siempre quedan dibujados y fuera del boceto.
#   prompt: en inglés, lo propio del dibujo primero y breve (CLIP corta a 77 tokens; el estilo se añade al final)
#   semilla: la candidata elegida tras revisar la hoja (vacía mientras no se elija)
#   estado: provisional -> está en uso con errores conocidos; `corregir` lista lo que hay que rehacer
encargos:
  - nombre: m2_osteoclasto_resorcion
    modulo: m2
    glifos: [bomba_protones, canal_cloruro, anhidrasa_carbonica_ii, catepsina_k, trap, receptores_rank_cfms]
    prompt: >-
      cutaway of a giant osteoclast cell resting on bone, translucent lilac cytoplasm, five dark purple oval nuclei
      with speckled chromatin, ruffled membrane over a dark acidic resorption pit, porous ivory bone
    semilla: 6  # integrada la corrección c2 (s6_v2c2.png): zona clara como pie del citoplasma; hoja del 2026-10-18 (refinado 0,62): núcleos con cromatina, sellado y borde festoneado alineados
    sufijo: _v2
    correcciones:
      - capas: ["zona_clara"]
        prompt: "pale homogeneous clear zone, the rim of cytoplasm of the same giant cell pressed flat and sealed against the bone surface, no organelles"
        negativo: "separate cells, spheres, nuclei, balls"
        fuerza: 0.9

  # --- Módulo 1 ---
  # m1_corte_hueso_capas: retirado el 2026-10-18; la actividad pasó a exploración 3D (modelo construido por código).
  # m1_osteona_detalle: retirado el 2026-10-18; la actividad pasó a exploración 3D (modelo construido por código).
  - nombre: m1_proceso_alveolar_corte
    modulo: m1
    glifos: []
    prompt: >-
      anatomical cross-section of a single lower tooth in the mandible, glossy white enamel crown, ivory dentin root
      around a red pulp canal, thin periodontal ligament, alveolar bone proper, buccal and lingual cortical plates, spongy
      bone with marrow, mandibular canal with nerve and vessels
    negativo: red crown, wood, bark, extra teeth, neighbouring teeth, gums, mouth
    semilla:   # 2026-10-25: sustituida por la versión texturizada exacta (texturizado.yaml)
    # Texturizado exacto (texturizar.py): color del dibujo -> tejido de la paleta común.
    tejidos:
      "#d98aa2": hueso_cortical
      "#c0648a": hueso_alveolar_propio
      "#b0607d": hueso_trabecular
      "#f3e6b3": medula_mixta
      "#b9cf8f": ligamento
      "#6f8f48": ligamento
      "#f2e5b6": dentina
      "#d9b26a": cemento
      "#fffaf0": esmalte
      "#f0a9a0": pulpa
      "#f6e9c0": medula_amarilla
      "#e7c84f": nervio
      "#f6e08a": nervio
      "#d9574a": arteria
      "#f8b9ad": arteria
      "#5b7fb3": vena
      "#a9c1e4": vena
  # m1_entretejido_laminar: retirado el 2026-10-18; la actividad pasó a exploración 3D (modelo construido por código).
  - nombre: m1_wolff_femur
    modulo: m1
    glifos: [trayectorias_compresion, trayectorias_traccion]
    boceto_con_glifos: true
    prompt: >-
      dry bone specimen of the upper femur sawn in half lengthwise, femoral head, neck and shaft, thin compact cortex,
      inner cancellous bone with oriented trabecular struts, isolated on white background
    semilla:   # 2026-10-25: sustituida por la versión texturizada exacta (texturizado.yaml)

  # --- Módulo 2 ---
  - nombre: m2_osteoblasto_activo
    modulo: m2
    glifos: [fosfatasa_alcalina, osteocalcina, ligandos_rankl_opg, uniones_comunicantes]
    prompt: >-
      plump living osteoblast cells lined up on a smooth pink osteoid layer over bone, granular cytoplasm,
      round nucleus, stacked rough endoplasmic reticulum, Golgi and secretory granules, thin flat lining cell on the right,
      electron microscopy inspired
    negativo: boxes, jellyfish, glass, plastic
    semilla:   # 2026-10-25: sustituida por la versión texturizada exacta (texturizado.yaml)
  - nombre: m2_osteocito_lagunar
    modulo: m2
    glifos: [esclerostina, osteocito_lagunar_uniones_comunicantes, fondo_rotulo_inset]
    prompt: >-
      violet star-shaped osteocyte with dark nucleus inside a pale lacuna in pink mineralized bone matrix, thin
      dendrites in canaliculi linking to neighbouring osteocytes, flat cells on the top surface, small capillary in the corner
    negativo: spider, flower, mouth, red center
    semilla:   # 2026-10-25: sustituida por la versión texturizada exacta (texturizado.yaml)
  # m2_ligamento_periodontal: retirado el 2026-10-18. La ilustración tenía una raíz irreal y células como anillos;
  # la actividad pasó a la exploración 3D `ligamento_periodontal` (apps/web/src/scenes/ligamento_periodontal).

  # --- Módulo 3 ---
  - nombre: m3_mandibula_desarrollo
    modulo: m3
    glifos: [decoracion_orientacion]
    prompt: >-
      cleared and stained fetal mandible specimen, alizarin red stained developing bone and alcian blue stained
      Meckel cartilage rod, unerupted tooth germs inside the jaw, translucent embryo tissue, macro photograph, white background
    negativo: adult teeth, erupted teeth, skull, gums, mouth, smile
    semilla:   # 2026-10-25: sustituida por la versión texturizada exacta (texturizado.yaml)
  # m3_osteoide_hueso_inmaduro: retirado el 2026-10-18; la actividad pasó a exploración 3D (modelo construido por código).
  # m3_osteocito_red_lacuno_canalicular: retirado el 2026-10-18; la actividad pasó a exploración 3D (modelo construido por código).

  - nombre: m3_sensores_mecanicos
    modulo: m3
    glifos: []
    prompt: "(texturizado: la forma sale del SVG)"
    semilla:
    tejidos:
      "#d98aa2": hueso_cortical
      "#dbe3fa": liquido
      "#d4eefa": liquido
      "#8a4f7c": colageno@original
      "#8fbccf": colageno@original
      "#6b3f7a": colageno@original
      "#e6c58a": membrana_lipidica
      "#f7e7c6": membrana_lipidica@original
      "#f0eaff": citoplasma
      "#9a86c8": actina
      "#8a6fe0": proteina@original
      "#b3a3f4": proteina@original
      "#2bb0c8": proteina@original
      "#3ec3da": proteina@original
      "#eafcff": proteina@original
      "#4fae6a": proteina@original
      "#eafbea": proteina@original
      "#f2b62c": liso@original
      "#fff6cf": liso@original
      "#e56a94": liso@original
      "#e8fbff": liso@original
      "#f6ecf4": citoplasma@original
      "#6f93e2": celula@original
      "#3b2f86": nucleo
      "#e58c3c": proteina@original

  # --- Módulo 4 ---
  # m4_frente_mineralizacion: retirado el 2026-10-18; la actividad pasó a exploración 3D (modelo construido por código).

  # --- Módulo 5 ---
  - nombre: m5_hueso_cortical_trabecular_alveolar
    modulo: m5
    glifos: []
    prompt: >-
      anatomical cross-section of a premolar in the mandible, glossy white enamel crown, smooth ivory dentin root
      with red pulp canal, thin periodontal ligament, alveolar bone proper, buccal and lingual cortical plates, spongy
      bone, basal bone with mandibular canal
    negativo: red crown, wood, bark, screw, implant, extra teeth, neighbouring teeth
    semilla:   # 2026-10-25: sustituida por la versión texturizada exacta (texturizado.yaml)
  - nombre: m5_movimiento_ortodontico_pdl
    modulo: m5
    glifos: [fuerza_ortodontica, senales_compresion, senales_tension]
    prompt: >-
      microscopic transverse section of a single tooth root embedded in jaw bone, circular dentin ring around a
      central pulp canal, periodontal ligament fibers compressed on the right and stretched on the left, osteoclasts and
      osteoblasts on the socket wall, bone with osteocytes
    negativo: teeth, crowns, molars, mouth, gums, smile
    semilla:   # 2026-10-25: sustituida por la versión texturizada exacta (texturizado.yaml)
  - nombre: m5_cicatrizacion_alveolo_fases
    modulo: m5
    glifos: [remodelado_del_reborde]
    prompt: >-
      buccolingual section through a healing extraction socket in the jaw bone, dark red blood clot on top,
      granulation tissue, new woven bone and trabecular bone filling the socket between the cortical walls, gum covering
      the top
    negativo: teeth, crowns, molars, roots, mouth
    semilla:   # 2026-10-25: sustituida por la versión texturizada exacta (texturizado.yaml)

